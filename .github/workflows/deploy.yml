name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static site
    runs-on: ubuntu-latest
    # The token lives in this environment, not in repository secrets. The
    # environment only accepts main and needs a second person's approval, so
    # a workflow pushed to another branch, or pushed straight to main, cannot
    # read the token on its own.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Cloudflare credentials
        env:
          CF_API_TOKEN_WORKERS: ${{ secrets.CF_API_TOKEN_WORKERS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN_WORKERS" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CF_API_TOKEN_WORKERS and/or CF_ACCOUNT_ID are empty. Add them as secrets of the production environment (Settings > Environments > production). See README.md, section Hosting."
            exit 1
          fi

      # Only the files the page needs. README, serve.py and tooling stay out.
      # wrangler.toml points at dist/ as the assets directory.
      - name: Assemble site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R css js vendor dist/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Creates the Worker on the first run, uploads the assets, and attaches
      # the custom domain declared in wrangler.toml.
      - name: Publish to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN_WORKERS }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "Deployed the \`scxml-visualizer\` Worker"
            echo ""
            echo "- custom domain: https://scxml.kronor.io"
            echo "- workers.dev: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
